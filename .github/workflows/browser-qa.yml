name: Elze SWIM browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p screenshots && mkdir -p Elze-swim && cp index.html app-v3.js dashboard-v4.css manifest.webmanifest sw.js Elze-swim/ && cp -r icons Elze-swim/
      - run: python3 -m http.server 8765 &
      - run: npx playwright test tests/dashboard.spec.cjs --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/
